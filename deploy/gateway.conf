server {
    listen 8080;
    server_name _;
    client_max_body_size 200m;
    auth_basic "EIC Research Team";
    auth_basic_user_file /etc/nginx/team.htpasswd;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    location /api/ { proxy_pass http://backend:8000; proxy_read_timeout 210s; proxy_set_header Host $host; }
    location /storage/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /health { proxy_pass http://backend:8000; }
    location / { proxy_pass http://frontend:3000; proxy_read_timeout 210s; proxy_set_header Host $host; }
}
