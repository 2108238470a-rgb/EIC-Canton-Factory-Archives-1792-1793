server {
    listen 80;
    server_name archives.mjyblog.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/eic-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name archives.mjyblog.top;
    ssl_certificate /opt/eic-research/tls/live/archives.mjyblog.top/fullchain.pem;
    ssl_certificate_key /opt/eic-research/tls/live/archives.mjyblog.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 200m;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    location / {
        proxy_pass http://127.0.0.1:3108;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 210s;
    }
}
